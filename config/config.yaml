server:
  host: 0.0.0.0
  port: 5678
  mode: release
  timeout: 90
  jwt_secret: ""
  jwt_expire_hours: 24

cache:
  type: memory
  addr: redis.orb.local:6379
  password: "1"
  db: 1
  ttl: 24h

database:
  driver: sqlite
  host: mysql.orb.local
  port: 3306
  user: root
  password: 123456
  name: /config/epg_sync.db
  debug: false
# 所有内置 provider 默认启用，这里只写需要覆盖的项（以 provider id 为 key）
providers: {}
#  ysp:
#    enabled: false
#  homeplus:
#    priority: 1
#    rate_limit: 3

logger:
  level: info          # debug, info, warn, error
  format: console          # json, console
  output: both          # stdout, stderr, file, both
  filename: /logs/epgsync.log
  max_size: 100         # MB
  max_backups: 10
  max_age: 30          # days
  compress: false
  enable_caller: false
  enable_stack_trace: true
  stack_trace_level: error