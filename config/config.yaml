# 程序行为配置，可选。所有项都有默认值，只需写要修改的项。
#   - 全部配置项及默认值见 INSTALL.md「配置说明」，默认值定义在 internal/config/defaults.go
#   - 数据库连接和 JWT 密钥不在这里配置，用环境变量设置，见 .env.example
#   - APP_ENV=dev 时，config/config.dev.yaml 会再覆盖本文件中的同名项
#
# 示例：
#
# server:
#   timeout: 120
#
# logger:
#   level: debug
#   output: both            # 同时写入 logs/epgsync.log
#   retention_days: 30      # 管理后台「系统日志」保留天数
#
# providers:                # 以 provider id 为 key，只写要覆盖的字段
#   ysp:
#     enabled: false
#   migu_tv:
#     priority: 1
#     rate_limit: 3
